<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A sorter and browser for STS2 cards.">
<title>STS2 Card Sorter</title>
<style>
:root{
  --bg:#101114;--panel:#191b20;--panel2:#22252b;--border:#383c45;
  --text:#f4f4f5;--muted:#a9adb6;
  --card-min-size: 165px;
  --header-height: 0px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{
  padding:16px 20px;
  padding-top: calc(var(--header-height) + 16px);
  min-height:100vh;
  transition: padding-top 0.3s ease;
}

#fab {
  position:fixed; top:12px; left:12px; z-index:100;
  width:44px; height:44px; border-radius:50%;
  background:var(--panel2); border:1px solid var(--border); color:var(--text);
  font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.6); transition: all 0.2s ease; user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#fab:hover { background:#30343b; transform:scale(1.05); }
#fab:active { transform:scale(0.95); }
#fab.pinned { background:#2a3a4a; border-color:#4a8aaa; color:#8adaaa; }

#header-wrapper {
  position:fixed; top:0; left:0; right:0; z-index:50;
  overflow:hidden; transition: height 0.3s ease, opacity 0.3s ease;
  height: auto; opacity:1; pointer-events:auto;
}
#header-wrapper.hidden { height: 0 !important; opacity:0; pointer-events: none; }
#header-wrapper.pinned { height: auto !important; opacity:1 !important; pointer-events: auto !important; }

header{
  width:100%; background:rgba(16,17,20,.97); border-bottom:1px solid var(--border);
  padding:12px 20px; padding-left:64px; transition: transform 0.3s ease; transform: translateY(0);
}
#header-wrapper.hidden header { transform: translateY(-100%); }
#header-wrapper.pinned header { transform: translateY(0) !important; }

.header-top{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:4px; }
h1{margin:0;font-size:22px;font-weight:700}

.controls{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:flex-end; }

.control-wrapper{ display:flex; flex-direction:column; gap:4px; justify-content:flex-end; min-width:0; }
.control-wrapper .control-label{
  font-size:10px; font-weight:800; text-transform:uppercase; color:var(--muted);
  display:block; line-height:1; margin:0; height:12px; 
}

.control-wrapper select,
.control-wrapper input[type="search"],
.control-wrapper input[type="range"],
.control-wrapper button#reset,
.control-wrapper button#pin-toggle {
  height: 32px; box-sizing: border-box; margin: 0;
}

.control-wrapper .toggles {
  min-height: 32px; box-sizing: border-box; margin: 0;
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
}

.control-wrapper select,
.control-wrapper input[type="search"]{
  background:var(--panel2); color:var(--text); border:1px solid var(--border);
  border-radius:6px; padding:0 10px; font:inherit; font-size:12px; width:100%; min-width:0;
}
.control-wrapper button#reset {
  background:var(--panel2); color:var(--text); border:1px solid var(--border);
  border-radius:6px; font:inherit; font-size:12px; cursor:pointer; padding:0 14px; white-space:nowrap;
}
.control-wrapper button#reset:hover{ background:#30343b; }

.control-wrapper .color-toggle,
.control-wrapper .type-toggle {
  padding:4px 8px; font-size:10px; white-space:nowrap; width:auto; height: 28px;
  box-sizing: border-box; background:var(--panel2); color:var(--text);
  border:1px solid var(--border); border-radius:6px; cursor:pointer;
  transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center;
}
.control-wrapper .color-toggle.active,
.control-wrapper .type-toggle.active { background:#555b65; border-color:#858b95; color:#fff; }
.control-wrapper .color-toggle:not(.active),
.control-wrapper .type-toggle:not(.active) { opacity:.38; text-decoration:line-through; }

.control-wrapper input[type="range"]{
  width:100%; padding:0; background:transparent; border:none;
  accent-color:#858b95; cursor:pointer; -webkit-appearance: none; appearance: none;
  display: flex; align-items: center;
}
.control-wrapper input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: var(--panel2); border-radius: 2px; }
.control-wrapper input[type="range"]::-moz-range-track { height: 4px; background: var(--panel2); border-radius: 2px; }
.control-wrapper input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #858b95; margin-top: -5px; cursor: pointer; }
.control-wrapper input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: #858b95; cursor: pointer; }

.control-wrapper.pin-wrapper button#pin-toggle{
  font-size:16px; line-height:1; padding:0 10px; width:auto; transition: all 0.2s ease;
  color:var(--muted); background:var(--panel2); border:1px solid var(--border); border-radius:6px;
  cursor:pointer; display:inline-block; text-align:center; user-select:none;
}
.control-wrapper.pin-wrapper button#pin-toggle:hover{ background:#30343b; color:var(--text); }
.control-wrapper.pin-wrapper button#pin-toggle.active{ background:#2a3a4a; border-color:#4a8aaa; color:#8adaaa; }
.control-wrapper.pin-wrapper button#pin-toggle.active:hover{ background:#2a4a5a; }
.control-wrapper.reset-wrapper button{ width:auto; }

#status{ margin-top:8px; color:var(--muted); font-size:12px; }

.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--card-min-size),1fr));
  gap:12px; max-width:1900px; margin:0 auto; list-style: none; padding: 0;
}

.card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:6px; box-shadow:0 4px 12px #0008; position:relative; }
.card-image-container{ position:relative; width:100%; border-radius:8px; overflow:hidden; background:#08090a; min-height:60px; }
.card-image{ display:block; width:100%; height:auto; border-radius:8px; cursor:zoom-in; background:#08090a; transition: opacity 0.3s ease; }
.card-image.loading{opacity:0.3} .card-image.loaded{opacity:1}

.card-name{ font-size:11px; font-weight:800; margin:4px 1px 1px; line-height:1.2; }
.card-meta{ color:var(--muted); font-size:8px; line-height:1.2; }
.card-actions{ display:flex; gap:3px; margin-top:3px; flex-wrap:wrap; }
.card-actions button{
  padding:2px 6px; font-size:8px; border-radius:3px; background:var(--panel2);
  border:1px solid var(--border); color:var(--muted); cursor:pointer;
  transition: all 0.2s ease; line-height:1.4;
}
.card-actions button:hover{ background:#30343b; color:var(--text); }
.card-actions button.active-upgrade{ background:#2a4a3a; border-color:#4a8a6a; color:#8adaaa; }
.card-actions button.active-enchant{ background:#3a2a4a; border-color:#8a6ada; color:#daaada; }
.card-actions button:disabled{ opacity:0.3; cursor:not-allowed; }

.error{ max-width:850px; margin:50px auto; padding:20px; border:1px solid #70343b; background:#321d20; border-radius:12px; }

.lightbox{
  position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,.92); z-index:1000;
  display:flex; align-items:center; justify-content:center; padding:40px; cursor:pointer; animation:fadeIn .2s ease;
}
.lightbox img{ max-width:100%; max-height:100%; object-fit:contain; border-radius:12px; box-shadow:0 10px 60px #000; }
.lightbox-close{
  position:fixed; top:20px;right:30px; font-size:40px; color:var(--text); cursor:pointer;
  background:none; border:none; padding:10px; opacity:.7; transition:opacity .2s;
}
.lightbox-close:hover{opacity:1}
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }

@media(max-width:650px){
  header{padding:10px 14px;padding-left:60px;}
  h1{font-size:18px}
  .controls{gap:5px}
  .controls>*{width:100%}
  .control-wrapper select, .control-wrapper input[type="search"], .control-wrapper input[type="range"],
  .control-wrapper button#reset, .control-wrapper button#pin-toggle, .control-wrapper .toggles { font-size:11px; }
  .control-wrapper.pin-wrapper button#pin-toggle{ width:100%; justify-content:center; }
  .control-wrapper.reset-wrapper button#reset{ width:100%; }
  main{padding:12px 14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(var(--card-min-size),1fr));gap:8px}
  .card{padding:4px}
  .card-name{font-size:10px}
  .card-meta{font-size:7px}
  .card-actions button{font-size:7px;padding:2px 4px}
  .lightbox{padding:20px}
  #fab { top:10px; left:10px; width:40px; height:40px; font-size:18px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important; scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<button id="fab" title="Toggle controls" aria-label="Toggle controls">✕</button>

<div id="header-wrapper">
  <header id="main-header">
    <div class="header-top"><h1>STS2 Card Sorter</h1></div>

    <div class="controls">
      <div class="control-wrapper">
        <span class="control-label" id="char-label">Characters</span>
        <div id="color-toggles" class="toggles" role="group" aria-labelledby="char-label">
          <button class="color-toggle active" data-color="ironclad">Ironclad</button>
          <button class="color-toggle active" data-color="silent">Silent</button>
          <button class="color-toggle active" data-color="defect">Defect</button>
          <button class="color-toggle active" data-color="necrobinder">Necrobinder</button>
          <button class="color-toggle active" data-color="regent">Regent</button>
          <button class="color-toggle active" data-color="colorless">Colorless</button>
          <button class="color-toggle active" data-color="misc">Misc</button>
        </div>
      </div>

      <div class="control-wrapper">
        <span class="control-label" id="type-label">Types</span>
        <div id="type-toggles" class="toggles" role="group" aria-labelledby="type-label">
          <button class="type-toggle active" data-type="attack">Attack</button>
          <button class="type-toggle active" data-type="skill">Skill</button>
          <button class="type-toggle active" data-type="power">Power</button>
          <button class="type-toggle active" data-type="status">Status</button>
          <button class="type-toggle active" data-type="curse">Curse</button>
          <button class="type-toggle active" data-type="token">Token</button>
          <button class="type-toggle active" data-type="event">Event</button>
          <button class="type-toggle active" data-type="quest">Quest</button>
        </div>
      </div>

      <div class="control-wrapper">
        <label for="sort" class="control-label">Sort</label>
        <select id="sort">
          <option value="rarity-asc">Rarity ↑</option>
          <option value="rarity-desc">Rarity ↓</option>
          <option value="cost-asc">Cost ↑</option>
          <option value="cost-desc">Cost ↓</option>
          <option value="name-asc">Name ↑</option>
          <option value="name-desc">Name ↓</option>
        </select>
      </div>

      <div class="control-wrapper">
        <label for="search" class="control-label">Search</label>
        <input id="search" type="search" placeholder="Card name or text…">
      </div>

      <div class="control-wrapper reset-wrapper">
        <span class="control-label" aria-hidden="true">&nbsp;</span>
        <button id="reset" aria-label="Reset all filters">Reset</button>
      </div>

      <div class="control-wrapper">
        <label for="card-size-slider" class="control-label">Card Size</label>
        <input type="range" id="card-size-slider" min="70" max="250" value="165" step="5">
      </div>

      <div class="control-wrapper pin-wrapper">
        <span class="control-label" aria-hidden="true">&nbsp;</span>
        <button id="pin-toggle" class="pin-toggle" title="Pin header (always visible)" aria-label="Pin header">⤒</button>
      </div>
    </div>

    <div id="status" aria-live="polite">Loading cards…</div>
  </header>
</div>

<main id="main-content"><ul id="grid" class="grid" role="list"></ul></main>

<script>
const API = "https://spire-codex.com/api/cards?lang=eng";
const ENCHANTMENTS_API = "https://spire-codex.com/api/enchantments?lang=eng";
const rarityRank = {Basic:0, Starter:0, Common:1, Uncommon:2, Rare:3, Event:4};

const STANDARD_COLORS = ['ironclad', 'silent', 'defect', 'necrobinder', 'regent', 'colorless'];

let cards = [];
let enchantments = [];
let cardStates = {};
const imageCache = new Map();
let currentVisibleCards = [];
let isRendering = false;
let isPinned = false;
let isHeaderVisible = true;

const COLOR_STORAGE_KEY = 'sts2_active_colors';

  Curious: "https://z-cdn-media.chatglm.cn/files/503e74e5-39de-4656-a720-735bfd6c2c4f.png?auth_key=1886596175-55422c87575642adbda330d57a1124fe-0-38a2ca02dcd16e50ca88057705f492ec",
  Violence: "https://slaythespire.wiki.gg/images/StS2_Colorless-MadScience-Violence.png?5d317f&format=original",

const madScienceVariants = [
  // Attacks
  { id: "MAD_SCIENCE_ATK_1", name: "Mad Science", type: "Attack", color: "event", cost: 1, rarity: "Event", description: "Deal 12 damage.\nApply 2 Weak.\nApply 2 Vulnerable.", description_upg: "Innate.\nDeal 12 damage.\nApply 2 Weak.\nApply 2 Vulnerable.", image_url_card: madScienceImages.Sapping, image_url_card_upg: madScienceImages.Sapping },
  { id: "MAD_SCIENCE_ATK_2", name: "Mad Science", type: "Attack", color: "event", cost: 1, rarity: "Event", description: "Deal 12 damage 3 times.", description_upg: "Innate.\nDeal 12 damage 3 times.", image_url_card: madScienceImages.Violence, image_url_card_upg: madScienceImages.Violence },
  { id: "MAD_SCIENCE_ATK_3", name: "Mad Science", type: "Attack", color: "event", cost: 1, rarity: "Event", description: "Deal 12 damage.\nWhenever you play a card this turn, the enemy loses 6 HP.", description_upg: "Innate.\nDeal 12 damage.\nWhenever you play a card this turn, the enemy loses 6 HP.", image_url_card: madScienceImages.Choking, image_url_card_upg: madScienceImages.Choking },

  { id: "MAD_SCIENCE_SKL_1", name: "Mad Science", type: "Skill", color: "event", cost: 1, rarity: "Event", description: "Gain 8 Block.\nGain 1 Colorless Energy.", description_upg: "Innate.\nGain 8 Block.\nGain 1 Colorless Energy.", image_url_card: madScienceImages.Energized, image_url_card_upg: madScienceImages.Energized },
  { id: "MAD_SCIENCE_SKL_2", name: "Mad Science", type: "Skill", color: "event", cost: 1, rarity: "Event", description: "Gain 8 Block.\nDraw 3 cards.", description_upg: "Innate.\nGain 8 Block.\nDraw 3 cards.", image_url_card: madScienceImages.Wisdom, image_url_card_upg: madScienceImages.Wisdom },
  { id: "MAD_SCIENCE_SKL_3", name: "Mad Science", type: "Skill", color: "event", cost: 1, rarity: "Event", description: "Gain 8 Block.\nAdd a random card into your Hand. It's free to play this turn.", description_upg: "Innate.\nGain 8 Block.\nAdd a random card into your Hand. It's free to play this turn.", image_url_card: madScienceImages.Chaos, image_url_card_upg: madScienceImages.Chaos },
  
  // Powers
  { id: "MAD_SCIENCE_PWR_1", name: "Mad Science", type: "Power", color: "event", cost: 1, rarity: "Event", description: "Gain 2 Strength.\nGain 2 Dexterity.", description_upg: "Innate.\nGain 2 Strength.\nGain 2 Dexterity.", image_url_card: madScienceImages.Expertise, image_url_card_upg: madScienceImages.Expertise },
  { id: "MAD_SCIENCE_PWR_2", name: "Mad Science", type: "Power", color: "event", cost: 1, rarity: "Event", description: "Powers cost 1 Colorless Energy less.", description_upg: "Innate.\nPowers cost 1 Colorless Energy less.", image_url_card: madScienceImages.Curious, image_url_card_upg: madScienceImages.Curious },
  { id: "MAD_SCIENCE_PWR_3", name: "Mad Science", type: "Power", color: "event", cost: 1, rarity: "Event", description: "At the end of combat, Upgrade a random card.", description_upg: "Innate.\nAt the end of combat, Upgrade a random card.", image_url_card: madScienceImages.Improvement, image_url_card_upg: madScienceImages.Improvement }

// --- LOCAL STORAGE HELPERS ---
function saveToggleStates(storageKey, selector) {
  const activeItems = [];
  document.querySelectorAll(selector).forEach(btn => activeItems.push(btn.dataset.color || btn.dataset.type));
  localStorage.setItem(storageKey, JSON.stringify(activeItems));
}

function loadToggleStates(storageKey) {
  const saved = localStorage.getItem(storageKey);
  if (!saved) return null;
  try { return JSON.parse(saved); } catch { return null; }
}

function applyToggleStates(activeItems, selector, dataAttr) {
  if (!activeItems || !Array.isArray(activeItems) || activeItems.length === 0) {
    document.querySelectorAll(selector).forEach(btn => btn.classList.add('active'));
    return;
  }
  document.querySelectorAll(selector).forEach(btn => {
    if (activeItems.includes(btn.dataset[dataAttr])) btn.classList.add('active');
    else btn.classList.remove('active');
  });
}

function updateMainPadding() {
  const wrapper = document.getElementById('header-wrapper');
  const isVisible = !wrapper.classList.contains('hidden');
  if (isVisible) {
    document.documentElement.style.setProperty('--header-height', wrapper.offsetHeight + 'px');
  } else {
    document.documentElement.style.setProperty('--header-height', '0px');
  }
}

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function costNumber(card){
  if (card.cost === undefined || card.cost === null) return 999;
  if (card.cost === "X" || card.cost === "x") return 999;
  const n = Number(card.cost);
  return Number.isFinite(n) ? n : 999;
}

function ensureAbsoluteUrl(url) {
  if (!url) return "";
  if (url.startsWith("http://") || url.startsWith("https://")) return url;
  if (url.startsWith("/")) return "https://spire-codex.com" + url;
  return url;
}

function openLightbox(imageUrl, cardName){
  const existing = document.querySelector('.lightbox');
  if(existing) existing.remove();
  lastFocusedElement = document.activeElement;
  
  const lightbox = document.createElement('div');
  lightbox.className = 'lightbox';
  lightbox.setAttribute('role', 'dialog');
  lightbox.setAttribute('aria-modal', 'true');
  lightbox.setAttribute('aria-label', cardName);
  
  const closeBtn = document.createElement('button');
  closeBtn.className = 'lightbox-close';
  closeBtn.innerHTML = '×';
  closeBtn.setAttribute('aria-label', 'Close');
  
  const img = document.createElement('img');
  img.src = imageUrl;
  img.alt = esc(cardName);
  img.loading = 'lazy';
  
  lightbox.appendChild(closeBtn);
  lightbox.appendChild(img);
  document.body.appendChild(lightbox);
  closeBtn.focus();
  
  const closeLightbox = () => {
    lightbox.remove();
    if (lastFocusedElement) lastFocusedElement.focus();
  };
  
  lightbox.addEventListener('click', (e) => {
    if(e.target === lightbox || e.target === closeBtn || e.target === img) closeLightbox();
  });
  
  const closeHandler = (e) => {
    if(e.key === 'Escape') {
      closeLightbox();
      document.removeEventListener('keydown', closeHandler);
    }
  };
  document.addEventListener('keydown', closeHandler);
}

function preloadImage(url) {
  return new Promise((resolve, reject) => {
    if (imageCache.has(url)) { resolve(imageCache.get(url)); return; }
    const img = new Image();
    img.onload = () => { imageCache.set(url, img); resolve(img); };
    img.onerror = () => { reject(new Error(`Failed to load image: ${url}`)); };
    img.src = url;
  });
}

async function toggleUpgrade(cardId){
  if (!cardStates[cardId]) cardStates[cardId] = { upgraded: false, enchantment: null };
  const newUpgraded = !cardStates[cardId].upgraded;
  const card = cards.find(c => c.id === cardId);
  if (!card) return;
  const tempState = { ...cardStates[cardId], upgraded: newUpgraded };
  const newImageUrl = getCardImage(card, tempState);
  if (newImageUrl) {
    try {
      await preloadImage(newImageUrl);
      cardStates[cardId].upgraded = newUpgraded;
      updateCard(cardId);
    } catch (error) {
      console.warn('Failed to preload upgrade image:', error);
      cardStates[cardId].upgraded = newUpgraded;
      updateCard(cardId);
    }
  } else {
    cardStates[cardId].upgraded = newUpgraded;
    updateCard(cardId);
  }
}

async function toggleEnchantment(cardId, enchantmentId){
  if (!cardStates[cardId]) cardStates[cardId] = { upgraded: false, enchantment: null };
  const card = cards.find(c => c.id === cardId);
  if (!card) return;
  const currentEnchantment = cardStates[cardId].enchantment;
  const newEnchantment = (currentEnchantment === enchantmentId) ? null : enchantmentId;
  const tempState = { ...cardStates[cardId], enchantment: newEnchantment };
  const newImageUrl = getCardImage(card, tempState);
  if (newImageUrl && newEnchantment !== null) {
    try {
      await preloadImage(newImageUrl);
      cardStates[cardId].enchantment = newEnchantment;
      updateCard(cardId);
    } catch (error) {
      console.warn('Failed to preload enchantment image:', error);
      cardStates[cardId].enchantment = newEnchantment;
      updateCard(cardId);
    }
  } else {
    cardStates[cardId].enchantment = newEnchantment;
    updateCard(cardId);
  }
}

function getCardImage(card, state){
  const isUpgraded = state?.upgraded || false;
  const enchantment = state?.enchantment || null;
  if (enchantment) {
    const cardId = card.id.toLowerCase();
    const enchId = enchantment.toLowerCase();
    if (isUpgraded) return `https://cdn.spire-codex.com/cards-full/stable/ench/${enchId}/${cardId}_upg.webp`;
    else return `https://cdn.spire-codex.com/cards-full/stable/ench/${enchId}/${cardId}.webp`;
  }
  if (isUpgraded) return ensureAbsoluteUrl(card.image_url_card_upg || card.image_url_card || card.image_url || "");
  else return ensureAbsoluteUrl(card.image_url_card || card.image_url || "");
}

function getCardSearchString(card) {
  let text = '';
  const extract = (obj) => {
    if (!obj) return;
    for (const key in obj) {
      if (typeof obj[key] === 'string') text += obj[key] + ' ';
      else if (Array.isArray(obj[key])) {
        obj[key].forEach(item => {
          if (typeof item === 'string') text += item + ' ';
          else if (typeof item === 'object') extract(item);
        });
      } else if (typeof obj[key] === 'object') extract(obj[key]);
    }
  };
  extract(card);
  return text.toLowerCase();
}

function getFilteredCards() {
  const search = document.getElementById("search").value.trim().toLowerCase();
  const activeColors = new Set([...document.querySelectorAll(".color-toggle.active")].map(button => button.dataset.color));
  const activeTypes = new Set([...document.querySelectorAll(".type-toggle.active")].map(button => button.dataset.type));
  
  return cards.filter(card => {
    const cardType = String(card.type ?? "").toLowerCase();
    const cardColor = String(card.color ?? "").toLowerCase();
    
    if (activeTypes.size === 0) return false;
    if (cardColor === 'token' && !activeTypes.has('token')) return false;
    if (cardColor === 'event' && !activeTypes.has('event')) return false;
    
    let typeMatch = false;
    for (const activeType of activeTypes) {
      if (activeType === 'event' || activeType === 'token') {
        if (cardColor === activeType) { typeMatch = true; break; }
      } else {
        if (cardType === activeType) { typeMatch = true; break; }
      }
    }
    if (!typeMatch) return false;
    
    if(activeColors.size === 0) return false;
    const isStandardColor = STANDARD_COLORS.includes(cardColor);
    if (isStandardColor) {
      if (!activeColors.has(cardColor)) return false;
    } else {
      if (!activeColors.has('misc')) return false;
    }
    
    if(search){
      const haystack = getCardSearchString(card);
      if(!haystack.includes(search)) return false;
    }
    return true;
  });
}

function sortCards(visible) {
  const sort = document.getElementById("sort").value;
  return visible.sort((a,b) => {
    const costA = costNumber(a);
    const costB = costNumber(b);
    if(sort === "name-asc") return String(a.name).localeCompare(String(b.name));
    if(sort === "name-desc") return String(b.name).localeCompare(String(a.name));
    if(sort.startsWith("rarity")){
      const rankA = rarityRank[a.rarity] ?? 99;
      const rankB = rarityRank[b.rarity] ?? 99;
      if(rankA !== rankB) return sort.endsWith("asc") ? rankA - rankB : rankB - rankA;
      if(costA !== costB) return costA - costB;
      return String(a.name).localeCompare(String(b.name));
    } else {
      if(costA !== costB) return sort.endsWith("asc") ? costA - costB : costB - costA;
      return String(a.name).localeCompare(String(b.name));
    }
  });
}

function createCardElement(card) {
  const state = cardStates[card.id] || { upgraded: false, enchantment: null };
  const isUpgraded = state.upgraded || false;
  const activeEnchantment = state.enchantment || null;
  const image = getCardImage(card, state);
  const hasUpgrade = !!card.image_url_card_upg || !!card.description_upg;
  const cardEnchantments = enchantments.filter(ench => ench.applicable_to && ench.applicable_to.includes(card.type?.toLowerCase()));
  const isImageCached = image ? imageCache.has(image) : false;
  
  const li = document.createElement('li');
  li.className = 'card';
  li.dataset.cardId = card.id;
  li.setAttribute('role', 'listitem');
  
  const container = document.createElement('div');
  container.className = 'card-image-container';
  if (image) {
    const img = document.createElement('img');
    img.className = `card-image ${isImageCached ? 'loaded' : 'loading'}`;
    img.src = image;
    img.alt = `${card.name}${isUpgraded ? ' (Upgraded)' : ''}${activeEnchantment ? ' enchanted with ' + activeEnchantment : ''}`;
    img.loading = 'lazy';
    img.dataset.action = 'lightbox';
    img.onload = () => { img.classList.remove('loading'); img.classList.add('loaded'); };
    img.onerror = () => {
      img.style.display = 'none';
      const errorDiv = document.createElement('div');
      errorDiv.className = 'error';
      errorDiv.style.padding = '12px';
      errorDiv.style.textAlign = 'center';
      errorDiv.style.fontSize = '10px';
      errorDiv.textContent = 'Failed to load image';
      container.appendChild(errorDiv);
    };
    container.appendChild(img);
  } else {
    const errorDiv = document.createElement('div');
    errorDiv.className = 'error';
    errorDiv.style.padding = '12px';
    errorDiv.style.textAlign = 'center';
    errorDiv.style.fontSize = '10px';
    errorDiv.textContent = 'No image available';
    container.appendChild(errorDiv);
  }
  li.appendChild(container);
  
  const name = document.createElement('div');
  name.className = 'card-name';
  name.textContent = `${card.name}${isUpgraded ? ' ✦' : ''}${activeEnchantment ? ' ✦✦' : ''}`;
  li.appendChild(name);
  
  const meta = document.createElement('div');
  meta.className = 'card-meta';
  meta.textContent = `${card.color} · ${card.rarity} · ${card.type} · Cost ${card.cost}`;
  li.appendChild(meta);
  
  const actions = document.createElement('div');
  actions.className = 'card-actions';
  if (hasUpgrade) {
    const upgradeBtn = document.createElement('button');
    upgradeBtn.className = isUpgraded ? 'active-upgrade' : '';
    upgradeBtn.textContent = isUpgraded ? '▼ Upgraded' : '▲ Upgrade';
    upgradeBtn.dataset.action = 'upgrade';
    actions.appendChild(upgradeBtn);
  } else {
    const disabledBtn = document.createElement('button');
    disabledBtn.disabled = true;
    disabledBtn.textContent = 'No Upgrade';
    actions.appendChild(disabledBtn);
  }
  cardEnchantments.forEach(ench => {
    const enchBtn = document.createElement('button');
    enchBtn.className = activeEnchantment === ench.id ? 'active-enchant' : '';
    enchBtn.textContent = `${activeEnchantment === ench.id ? '▼' : '✦'} ${ench.name || ench.id}`;
    enchBtn.dataset.action = 'enchant';
    enchBtn.dataset.enchantmentId = ench.id; 
    actions.appendChild(enchBtn);
  });
  li.appendChild(actions);
  return li;
}

function updateCard(cardId) {
  const card = cards.find(c => c.id === cardId);
  if (!card) return;
  const grid = document.getElementById('grid');
  const existingCard = grid.querySelector(`[data-card-id="${cardId}"]`);
  if (existingCard) existingCard.replaceWith(createCardElement(card));
}

function render() {
  if (isRendering) return;
  isRendering = true;
  const visible = getFilteredCards();
  const sorted = sortCards(visible);
  currentVisibleCards = sorted;
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  status.textContent = `${sorted.length} card${sorted.length === 1 ? '' : 's'} shown · ${cards.length} loaded`;
  
  if (grid.children.length === 0) {
    sorted.forEach(card => grid.appendChild(createCardElement(card)));
  } else {
    const currentCardIds = new Set();
    grid.querySelectorAll('.card').forEach(el => currentCardIds.add(el.dataset.cardId));
    const newCardIds = new Set(sorted.map(c => c.id));
    for (const el of grid.querySelectorAll('.card')) {
      if (!newCardIds.has(el.dataset.cardId)) el.remove();
    }
    sorted.forEach((card, index) => {
      const existingEl = grid.querySelector(`[data-card-id="${card.id}"]`);
      const targetPosition = grid.children[index];
      if (!existingEl) {
        const newCard = createCardElement(card);
        if (targetPosition) grid.insertBefore(newCard, targetPosition);
        else grid.appendChild(newCard);
      } else if (existingEl !== targetPosition) {
        if (targetPosition) grid.insertBefore(existingEl, targetPosition);
        else grid.appendChild(existingEl);
      }
    });
  }
  isRendering = false;
}

function updateCardSize(value) {
  const size = parseInt(value);
  document.documentElement.style.setProperty('--card-min-size', size + 'px');
  localStorage.setItem('cardSize', size);
}

function setHeaderVisibility(visible) {
  const wrapper = document.getElementById('header-wrapper');
  const fab = document.getElementById('fab');
  if (isPinned) return;
  isHeaderVisible = visible;
  if (visible) {
    wrapper.classList.remove('hidden');
    wrapper.style.height = 'auto';
    fab.textContent = '✕'; fab.title = 'Close controls';
    requestAnimationFrame(updateMainPadding);
  } else {
    wrapper.classList.add('hidden');
    wrapper.style.height = '0px';
    fab.textContent = '☰'; fab.title = 'Open controls';
    document.documentElement.style.setProperty('--header-height', '0px');
  }
}

function toggleHeaderVisibility() {
  if (isPinned) return;
  setHeaderVisibility(!isHeaderVisible);
}

function togglePin() {
  const wrapper = document.getElementById('header-wrapper');
  const pinToggle = document.getElementById('pin-toggle');
  const fab = document.getElementById('fab');
  isPinned = !isPinned;
  if (isPinned) {
    wrapper.classList.add('pinned');
    wrapper.classList.remove('hidden');
    wrapper.style.height = 'auto';
    fab.classList.add('pinned');
    pinToggle.classList.add('active');
    pinToggle.textContent = '⤓'; pinToggle.title = 'Unpin header';
    fab.textContent = '✕'; fab.title = 'Close controls (pinned)';
    isHeaderVisible = true;
    requestAnimationFrame(updateMainPadding);
  } else {
    wrapper.classList.remove('pinned');
    fab.classList.remove('pinned');
    pinToggle.classList.remove('active');
    pinToggle.textContent = '⤒'; pinToggle.title = 'Pin header';
    if (!isHeaderVisible) document.documentElement.style.setProperty('--header-height', '0px');
    else requestAnimationFrame(updateMainPadding);
  }
  localStorage.setItem('headerPinned', isPinned);
}

function handleScroll() {
  if (isPinned) return;
  const currentScrollY = window.scrollY;
  if (currentScrollY > lastScrollY && currentScrollY > 50) {
    if (isHeaderVisible) setHeaderVisibility(false);
  }
  lastScrollY = currentScrollY;
}

let scrollTimeout;
window.addEventListener('scroll', () => {
  if (!scrollTimeout) {
    scrollTimeout = setTimeout(() => { handleScroll(); scrollTimeout = null; }, 10);
  }
});

window.addEventListener('resize', () => {
  if (isPinned || isHeaderVisible) requestAnimationFrame(updateMainPadding);
});

async function loadCards(){
  const savedColors = loadToggleStates(COLOR_STORAGE_KEY);
  applyToggleStates(savedColors, '.color-toggle', 'color');
  const savedTypes = loadToggleStates(TYPE_STORAGE_KEY);
  applyToggleStates(savedTypes, '.type-toggle', 'type');
  
  let defaultSize = 165;
  if (window.innerWidth < 600) defaultSize = 95;
  const savedSize = localStorage.getItem('cardSize');
  let sizeToUse = savedSize ? parseInt(savedSize) : defaultSize;
  document.getElementById('card-size-slider').value = sizeToUse;
  document.documentElement.style.setProperty('--card-min-size', sizeToUse + 'px');
  
  const savedPin = localStorage.getItem('headerPinned');
  if (savedPin === 'true') {
    isPinned = true;
    const wrapper = document.getElementById('header-wrapper');
    const pinToggle = document.getElementById('pin-toggle');
    const fab = document.getElementById('fab');
    wrapper.classList.add('pinned');
    wrapper.classList.remove('hidden');
    wrapper.style.height = 'auto';
    fab.classList.add('pinned');
    fab.textContent = '✕'; fab.title = 'Close controls (pinned)';
    pinToggle.classList.add('active');
    pinToggle.textContent = '⤓'; pinToggle.title = 'Unpin header';
    isHeaderVisible = true;
    requestAnimationFrame(updateMainPadding);
  } else {
    isHeaderVisible = true;
    document.getElementById('header-wrapper').classList.remove('hidden');
    document.getElementById('header-wrapper').style.height = 'auto';
    document.getElementById('fab').textContent = '✕';
    document.getElementById('fab').title = 'Close controls';
    requestAnimationFrame(updateMainPadding);
  }
  
  window.addEventListener('pageshow', function() {
    setTimeout(function() {
      if (!isPinned) {
        const wrapper = document.getElementById('header-wrapper');
        const fab = document.getElementById('fab');
        wrapper.classList.remove('hidden');
        wrapper.style.height = 'auto';
        wrapper.style.opacity = '1';
        fab.textContent = '✕'; fab.title = 'Close controls';
        isHeaderVisible = true;
        lastScrollY = window.scrollY;
        updateMainPadding();
      }
    }, 150);
  });
  
  try{
    const [cardsResponse, enchResponse] = await Promise.all([fetch(API), fetch(ENCHANTMENTS_API)]);
    if(!cardsResponse.ok) throw new Error(`Spire Codex returned HTTP ${cardsResponse.status}`);
    const cardsData = await cardsResponse.json();
    cards = Array.isArray(cardsData) ? cardsData : (cardsData.cards || cardsData.results || []);
    
    // --- MAD SCIENCE INJECTION ---
    cards = cards.filter(c => c.id !== "MAD_SCIENCE");
    cards.push(...madScienceVariants);

    if(enchResponse.ok){
      const enchData = await enchResponse.json();
      enchantments = Array.isArray(enchData) ? enchData : (enchData.enchantments || enchData.results || []);
    }
    render();
  }catch(error){
    document.getElementById("status").textContent = "Failed to load cards.";
    document.getElementById("grid").innerHTML = `
      <li class="error" role="status">
        <strong>Could not load the Spire Codex card database.</strong>
        <p>${esc(error.message)}</p>
        <p>If your browser blocks requests from a local HTML file, run this file through a simple local web server instead.</p>
      </li>`;
  }
}

// --- EVENT LISTENERS ---
document.querySelectorAll(".color-toggle").forEach(button => {
  button.addEventListener("click", () => {
    button.classList.toggle("active");
    saveToggleStates(COLOR_STORAGE_KEY, '.color-toggle.active');
    render();
  });
});

document.querySelectorAll(".type-toggle").forEach(button => {
  button.addEventListener("click", () => {
    button.classList.toggle("active");
    saveToggleStates(TYPE_STORAGE_KEY, '.type-toggle.active');
    render();
  });
});

document.getElementById("sort").addEventListener("change", render);

let searchTimeout;
document.getElementById("search").addEventListener("input", () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => { render(); }, 200);
});

document.getElementById("reset").addEventListener("click", () => {
  document.querySelectorAll(".color-toggle, .type-toggle").forEach(button => button.classList.add("active"));
  saveToggleStates(COLOR_STORAGE_KEY, '.color-toggle.active');
  saveToggleStates(TYPE_STORAGE_KEY, '.type-toggle.active');
  document.getElementById("sort").value = "rarity-asc";
  document.getElementById("search").value = "";
  cardStates = {};
  imageCache.clear();
  render();
});

document.getElementById('card-size-slider').addEventListener('input', (e) => updateCardSize(e.target.value));
document.getElementById('fab').addEventListener('click', toggleHeaderVisibility);
document.getElementById('pin-toggle').addEventListener('click', togglePin);

const grid = document.getElementById('grid');
grid.addEventListener('click', (e) => {
  const cardEl = e.target.closest('.card');
  if (!cardEl) return;
  const cardId = cardEl.dataset.cardId;
  if (e.target.classList.contains('card-image')) {
    openLightbox(e.target.src, e.target.alt);
    return;
  }
  const button = e.target.closest('button');
  if (!button) return;
  if (button.dataset.action === 'upgrade') toggleUpgrade(cardId);
  else if (button.dataset.action === 'enchant') toggleEnchantment(cardId, button.dataset.enchantmentId);
});

loadCards();
</script>
