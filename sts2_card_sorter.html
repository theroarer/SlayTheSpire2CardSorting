<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STS2 Card Sorter</title>
<style>
:root{
  --bg:#101114;--panel:#191b20;--panel2:#22252b;--border:#383c45;
  --text:#f4f4f5;--muted:#a9adb6;
  --card-min-size: 120px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{padding:16px 20px;min-height:100vh;}

/* --- PULL TAB --- */
#pull-tab {
  position:sticky;
  top:0;
  z-index:25;
  height:28px;
  background:rgba(16,17,20,.95);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition: transform 0.3s ease, opacity 0.3s ease;
  transform: translateY(0);
  opacity:1;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#pull-tab.hidden {
  transform: translateY(-100%);
  opacity:0;
  pointer-events:none;
}
#pull-tab .handle {
  width:40px;
  height:4px;
  background:var(--muted);
  border-radius:2px;
  opacity:0.5;
  transition: opacity 0.2s ease;
}
#pull-tab:hover .handle {
  opacity:0.8;
}
#pull-tab .tab-label {
  position:absolute;
  right:16px;
  font-size:10px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.5px;
  opacity:0.5;
}

/* --- HEADER --- */
header{
  position:sticky;
  top:-1px;
  z-index:20;
  background:rgba(16,17,20,.97);
  border-bottom:1px solid var(--border);
  padding:12px 20px;
  transition: transform 0.3s ease, opacity 0.3s ease, margin-bottom 0.3s ease;
  transform: translateY(0);
  opacity:1;
  margin-bottom:0;
}
header.hidden {
  transform: translateY(-100%);
  opacity:0;
  pointer-events:none;
  margin-bottom:-100px;
}
header.pinned {
  transform: translateY(0) !important;
  opacity:1 !important;
  pointer-events:auto !important;
  margin-bottom:0 !important;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:4px;
}
h1{margin:0;font-size:22px;font-weight:700}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
  align-items:end;
}

/* --- UNIFIED CONTROL WRAPPER --- */
.control-wrapper{
  display:flex;
  flex-direction:column;
  gap:4px;
  justify-content:flex-end;
  min-width:0;
}
.control-wrapper .control-label,
.control-wrapper .label-placeholder{
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  color:var(--muted);
  display:block;
  line-height:1;
  margin:0;
  padding:0;
  height:10px;
}
.control-wrapper .label-placeholder{
  visibility:hidden;
}
.control-wrapper select,
.control-wrapper input,
.control-wrapper button{
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:6px;
  padding:6px 10px;
  font:inherit;
  font-size:12px;
  width:100%;
  min-width:0;
}
.control-wrapper button{
  cursor:pointer;
  padding:6px 14px;
  white-space:nowrap;
}
.control-wrapper button:hover{
  background:#30343b;
}
.control-wrapper .color-toggle{
  padding:4px 8px;
  font-size:10px;
  white-space:nowrap;
  width:auto;
}
.control-wrapper .color-toggle.active{
  background:#555b65;
  border-color:#858b95;
  color:#fff;
}
.control-wrapper .color-toggle:not(.active){
  opacity:.38;
  text-decoration:line-through;
}
.control-wrapper .toggles{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
}
.control-wrapper input[type="range"]{
  width:100%;
  padding:0;
  background:transparent;
  border:none;
  accent-color:#858b95;
  cursor:pointer;
}
.control-wrapper .slider-value{
  font-size:10px;
  color:var(--muted);
  text-align:center;
  margin-top:1px;
}
/* Pin toggle */
.control-wrapper.pin-wrapper .pin-toggle{
  font-size:16px;
  line-height:1;
  padding:6px 10px;
  width:auto;
  transition: all 0.2s ease;
  color:var(--muted);
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:6px;
  cursor:pointer;
  display:inline-block;
  text-align:center;
  user-select:none;
}
.control-wrapper.pin-wrapper .pin-toggle:hover{
  background:#30343b;
  color:var(--text);
}
.control-wrapper.pin-wrapper .pin-toggle.active{
  background:#2a3a4a;
  border-color:#4a8aaa;
  color:#8adaaa;
}
.control-wrapper.pin-wrapper .pin-toggle.active:hover{
  background:#2a4a5a;
}
/* Reset button - consistent width */
.control-wrapper.reset-wrapper button{
  width:auto;
}

#status{
  margin-top:8px;
  color:var(--muted);
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(var(--card-min-size),1fr));
  gap:12px;
  max-width:1900px;
  margin:0 auto;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:6px;
  box-shadow:0 4px 12px #0008;
  position:relative;
}

.card-image-container{
  position:relative;
  width:100%;
  border-radius:8px;
  overflow:hidden;
  background:#08090a;
  min-height:60px;
}
.card-image{
  display:block;
  width:100%;
  height:auto;
  border-radius:8px;
  cursor:zoom-in;
  background:#08090a;
  transition: opacity 0.3s ease;
}
.card-image.loading{opacity:0.3}
.card-image.loaded{opacity:1}

.card-name{
  font-size:11px;
  font-weight:800;
  margin:4px 1px 1px;
  line-height:1.2;
}
.card-meta{
  color:var(--muted);
  font-size:8px;
  line-height:1.2;
}
.card-actions{
  display:flex;
  gap:3px;
  margin-top:3px;
  flex-wrap:wrap;
}
.card-actions button{
  padding:2px 6px;
  font-size:8px;
  border-radius:3px;
  background:var(--panel2);
  border:1px solid var(--border);
  color:var(--muted);
  cursor:pointer;
  transition: all 0.2s ease;
  line-height:1.4;
}
.card-actions button:hover{
  background:#30343b;
  color:var(--text);
}
.card-actions button.active-upgrade{
  background:#2a4a3a;
  border-color:#4a8a6a;
  color:#8adaaa;
}
.card-actions button.active-enchant{
  background:#3a2a4a;
  border-color:#8a6ada;
  color:#daaada;
}
.card-actions button:disabled{
  opacity:0.3;
  cursor:not-allowed;
}

.error{
  max-width:850px;
  margin:50px auto;
  padding:20px;
  border:1px solid #70343b;
  background:#321d20;
  border-radius:12px;
}

/* Lightbox */
.lightbox{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.92);
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
  cursor:pointer;
  animation:fadeIn .2s ease;
}
.lightbox img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  border-radius:12px;
  box-shadow:0 10px 60px #000;
}
.lightbox-close{
  position:fixed;
  top:20px;right:30px;
  font-size:40px;
  color:var(--text);
  cursor:pointer;
  background:none;
  border:none;
  padding:10px;
  opacity:.7;
  transition:opacity .2s;
}
.lightbox-close:hover{opacity:1}
@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

@media(max-width:650px){
  header{padding:10px 14px}
  h1{font-size:18px}
  .controls{gap:5px}
  .controls>*{width:100%}
  .control-wrapper select,
  .control-wrapper input,
  .control-wrapper button{
    font-size:11px;
  }
  .control-wrapper.pin-wrapper .pin-toggle{
    width:100%;
    justify-content:center;
  }
  .control-wrapper.reset-wrapper button{
    width:100%;
  }
  main{padding:12px 14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(var(--card-min-size),1fr));gap:8px}
  .card{padding:4px}
  .card-name{font-size:10px}
  .card-meta{font-size:7px}
  .card-actions button{font-size:7px;padding:2px 4px}
  .lightbox{padding:20px}
  #pull-tab .tab-label {
    display:none;
  }
}
</style>
</head>
<body>

<!-- PULL TAB -->
<div id="pull-tab" title="Tap to show/hide controls">
  <div class="handle"></div>
  <span class="tab-label">Controls</span>
</div>

<header id="main-header">
  <div class="header-top">
    <h1>STS2 Card Sorter</h1>
  </div>

  <div class="controls">
    <!-- Characters -->
    <div class="control-wrapper">
      <span class="control-label">Characters</span>
      <div id="color-toggles" class="toggles">
        <button class="color-toggle active" data-color="ironclad">Ironclad</button>
        <button class="color-toggle active" data-color="silent">Silent</button>
        <button class="color-toggle active" data-color="defect">Defect</button>
        <button class="color-toggle active" data-color="necrobinder">Necrobinder</button>
        <button class="color-toggle active" data-color="regent">Regent</button>
        <button class="color-toggle active" data-color="colorless">Colorless</button>
      </div>
    </div>

    <!-- Sort -->
    <div class="control-wrapper">
      <span class="control-label">Sort</span>
      <select id="sort">
        <option value="rarity-asc">Rarity ↑</option>
        <option value="rarity-desc">Rarity ↓</option>
        <option value="cost-asc">Cost ↑</option>
        <option value="cost-desc">Cost ↓</option>
        <option value="name-asc">Name ↑</option>
        <option value="name-desc">Name ↓</option>
      </select>
    </div>

    <!-- Search -->
    <div class="control-wrapper">
      <span class="control-label">Search</span>
      <input id="search" type="search" placeholder="Card name or text…">
    </div>

    <!-- Reset -->
    <div class="control-wrapper reset-wrapper">
      <span class="label-placeholder">Placeholder</span>
      <button id="reset">Reset</button>
    </div>

    <!-- Card Size -->
    <div class="control-wrapper">
      <span class="control-label">Card Size</span>
      <input type="range" id="card-size-slider" min="70" max="250" value="120" step="5">
      <div class="slider-value" id="slider-value">120</div>
    </div>

    <!-- Pin Toggle -->
    <div class="control-wrapper pin-wrapper">
      <span class="label-placeholder">Placeholder</span>
      <div role="button" tabindex="0" id="pin-toggle" class="pin-toggle" title="Pin header (always visible)">⤒</div>
    </div>
  </div>

  <div id="status">Loading cards…</div>
</header>

<main><div id="grid" class="grid"></div></main>

<script>
const API = "https://spire-codex.com/api/cards?lang=eng";
const ENCHANTMENTS_API = "https://spire-codex.com/api/enchantments?lang=eng";
const rarityRank = {Basic:0, Starter:0, Common:1, Uncommon:2, Rare:3};

let cards = [];
let enchantments = [];
let cardStates = {};
const imageCache = new Map();
let currentVisibleCards = [];
let isRendering = false;
let isPinned = false;
let isHeaderVisible = true;
let lastScrollY = 0;
let isUserInteracting = false;

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function costNumber(card){
  if (card.cost === undefined || card.cost === null) return 999;
  if (card.cost === "X" || card.cost === "x") return 999;
  const n = Number(card.cost);
  return Number.isFinite(n) ? n : 999;
}

function openLightbox(imageUrl, cardName){
  const existing = document.querySelector('.lightbox');
  if(existing) existing.remove();
  
  const lightbox = document.createElement('div');
  lightbox.className = 'lightbox';
  
  const closeBtn = document.createElement('button');
  closeBtn.className = 'lightbox-close';
  closeBtn.innerHTML = '×';
  closeBtn.setAttribute('aria-label', 'Close');
  
  const img = document.createElement('img');
  img.src = imageUrl;
  img.alt = esc(cardName);
  img.loading = 'lazy';
  
  lightbox.appendChild(closeBtn);
  lightbox.appendChild(img);
  document.body.appendChild(lightbox);
  
  lightbox.addEventListener('click', (e) => {
    if(e.target === lightbox || e.target === closeBtn || e.target === img) {
      lightbox.remove();
    }
  });
  
  const closeHandler = (e) => {
    if(e.key === 'Escape') {
      lightbox.remove();
      document.removeEventListener('keydown', closeHandler);
    }
  };
  document.addEventListener('keydown', closeHandler);
}

function preloadImage(url) {
  return new Promise((resolve, reject) => {
    if (imageCache.has(url)) {
      resolve(imageCache.get(url));
      return;
    }
    const img = new Image();
    img.onload = () => {
      imageCache.set(url, img);
      resolve(img);
    };
    img.onerror = () => {
      reject(new Error(`Failed to load image: ${url}`));
    };
    img.src = url;
  });
}

async function toggleUpgrade(cardId){
  if (!cardStates[cardId]) cardStates[cardId] = { upgraded: false, enchantment: null };
  const newUpgraded = !cardStates[cardId].upgraded;
  const card = cards.find(c => c.id === cardId);
  if (!card) return;
  const tempState = { ...cardStates[cardId], upgraded: newUpgraded };
  const newImageUrl = getCardImage(card, tempState);
  if (newImageUrl) {
    try {
      await preloadImage(newImageUrl);
      cardStates[cardId].upgraded = newUpgraded;
      updateCard(cardId);
    } catch (error) {
      console.warn('Failed to preload upgrade image:', error);
      cardStates[cardId].upgraded = newUpgraded;
      updateCard(cardId);
    }
  } else {
    cardStates[cardId].upgraded = newUpgraded;
    updateCard(cardId);
  }
}

async function toggleEnchantment(cardId, enchantmentId){
  if (!cardStates[cardId]) cardStates[cardId] = { upgraded: false, enchantment: null };
  const card = cards.find(c => c.id === cardId);
  if (!card) return;
  const currentEnchantment = cardStates[cardId].enchantment;
  const newEnchantment = (currentEnchantment === enchantmentId) ? null : enchantmentId;
  const tempState = { ...cardStates[cardId], enchantment: newEnchantment };
  const newImageUrl = getCardImage(card, tempState);
  if (newImageUrl && newEnchantment !== null) {
    try {
      await preloadImage(newImageUrl);
      cardStates[cardId].enchantment = newEnchantment;
      updateCard(cardId);
    } catch (error) {
      console.warn('Failed to preload enchantment image:', error);
      cardStates[cardId].enchantment = newEnchantment;
      updateCard(cardId);
    }
  } else {
    cardStates[cardId].enchantment = newEnchantment;
    updateCard(cardId);
  }
}

function getCardImage(card, state){
  const isUpgraded = state?.upgraded || false;
  const enchantment = state?.enchantment || null;
  if (enchantment) {
    const cardId = card.id.toLowerCase();
    const enchId = enchantment.toLowerCase();
    if (isUpgraded) {
      return `https://cdn.spire-codex.com/cards-full/stable/ench/${enchId}/${cardId}_upg.webp`;
    } else {
      return `https://cdn.spire-codex.com/cards-full/stable/ench/${enchId}/${cardId}.webp`;
    }
  }
  if (isUpgraded) {
    return card.image_url_card_upg || card.image_url_card || card.image_url || "";
  } else {
    return card.image_url_card || card.image_url || "";
  }
}

function getFilteredCards() {
  const search = document.getElementById("search").value.trim().toLowerCase();
  const activeColors = new Set(
    [...document.querySelectorAll(".color-toggle.active")]
      .map(button => button.dataset.color)
  );
  return cards.filter(card => {
    if(activeColors.size === 0) return false;
    if(!activeColors.has(String(card.color).toLowerCase())) return false;
    if(search){
      const haystack = [
        card.name, card.description, card.type, card.rarity, card.color, card.id
      ].join(" ").toLowerCase();
      if(!haystack.includes(search)) return false;
    }
    return true;
  });
}

function sortCards(visible) {
  const sort = document.getElementById("sort").value;
  return visible.sort((a,b) => {
    const costA = costNumber(a);
    const costB = costNumber(b);
    if(sort === "name-asc"){
      return String(a.name).localeCompare(String(b.name));
    }
    if(sort === "name-desc"){
      return String(b.name).localeCompare(String(a.name));
    }
    if(sort.startsWith("rarity")){
      const rankA = rarityRank[a.rarity] ?? 99;
      const rankB = rarityRank[b.rarity] ?? 99;
      if(rankA !== rankB) {
        return sort.endsWith("asc") ? rankA - rankB : rankB - rankA;
      }
      if(costA !== costB) {
        return costA - costB;
      }
      return String(a.name).localeCompare(String(b.name));
    } else {
      if(costA !== costB) {
        return sort.endsWith("asc") ? costA - costB : costB - costA;
      }
      return String(a.name).localeCompare(String(b.name));
    }
  });
}

function createCardElement(card) {
  const state = cardStates[card.id] || { upgraded: false, enchantment: null };
  const isUpgraded = state.upgraded || false;
  const activeEnchantment = state.enchantment || null;
  const image = getCardImage(card, state);
  const hasUpgrade = !!card.image_url_card_upg;
  const cardEnchantments = enchantments.filter(ench => 
    ench.applicable_to && ench.applicable_to.includes(card.type?.toLowerCase())
  );
  const isImageCached = image ? imageCache.has(image) : false;
  
  const article = document.createElement('article');
  article.className = 'card';
  article.dataset.cardId = card.id;
  
  const container = document.createElement('div');
  container.className = 'card-image-container';
  if (image) {
    const img = document.createElement('img');
    img.className = `card-image ${isImageCached ? 'loaded' : 'loading'}`;
    img.src = image;
    img.alt = `${card.name}${isUpgraded ? ' (Upgraded)' : ''}${activeEnchantment ? ' enchanted with ' + activeEnchantment : ''}`;
    img.loading = 'lazy';
    img.onclick = () => openLightbox(image, `${card.name}${isUpgraded ? ' (Upgraded)' : ''}${activeEnchantment ? ' with ' + activeEnchantment : ''}`);
    img.onload = () => {
      img.classList.remove('loading');
      img.classList.add('loaded');
    };
    img.onerror = () => {
      img.style.display = 'none';
      const errorDiv = document.createElement('div');
      errorDiv.className = 'error';
      errorDiv.style.padding = '12px';
      errorDiv.style.textAlign = 'center';
      errorDiv.style.fontSize = '10px';
      errorDiv.textContent = 'Failed to load image';
      container.appendChild(errorDiv);
    };
    container.appendChild(img);
  } else {
    const errorDiv = document.createElement('div');
    errorDiv.className = 'error';
    errorDiv.style.padding = '12px';
    errorDiv.style.textAlign = 'center';
    errorDiv.style.fontSize = '10px';
    errorDiv.textContent = 'No image available';
    container.appendChild(errorDiv);
  }
  article.appendChild(container);
  
  const name = document.createElement('div');
  name.className = 'card-name';
  name.textContent = `${card.name}${isUpgraded ? ' ✦' : ''}${activeEnchantment ? ' ✦✦' : ''}`;
  article.appendChild(name);
  
  const meta = document.createElement('div');
  meta.className = 'card-meta';
  meta.textContent = `${card.color} · ${card.rarity} · ${card.type} · Cost ${card.cost}`;
  article.appendChild(meta);
  
  const actions = document.createElement('div');
  actions.className = 'card-actions';
  if (hasUpgrade) {
    const upgradeBtn = document.createElement('button');
    upgradeBtn.className = isUpgraded ? 'active-upgrade' : '';
    upgradeBtn.textContent = isUpgraded ? '▼ Upgraded' : '▲ Upgrade';
    upgradeBtn.onclick = () => toggleUpgrade(card.id);
    actions.appendChild(upgradeBtn);
  } else {
    const disabledBtn = document.createElement('button');
    disabledBtn.disabled = true;
    disabledBtn.textContent = 'No Upgrade';
    actions.appendChild(disabledBtn);
  }
  cardEnchantments.forEach(ench => {
    const enchBtn = document.createElement('button');
    enchBtn.className = activeEnchantment === ench.id ? 'active-enchant' : '';
    enchBtn.textContent = `${activeEnchantment === ench.id ? '▼' : '✦'} ${ench.name || ench.id}`;
    enchBtn.onclick = () => toggleEnchantment(card.id, ench.id);
    actions.appendChild(enchBtn);
  });
  article.appendChild(actions);
  return article;
}

function updateCard(cardId) {
  const card = cards.find(c => c.id === cardId);
  if (!card) return;
  const grid = document.getElementById('grid');
  const existingCard = grid.querySelector(`[data-card-id="${cardId}"]`);
  if (existingCard) {
    const newCard = createCardElement(card);
    existingCard.replaceWith(newCard);
  }
}

function render() {
  if (isRendering) return;
  isRendering = true;
  const visible = getFilteredCards();
  const sorted = sortCards(visible);
  currentVisibleCards = sorted;
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  status.textContent = `${sorted.length} card${sorted.length === 1 ? '' : 's'} shown · ${cards.length} loaded`;
  
  if (grid.children.length === 0) {
    sorted.forEach(card => {
      grid.appendChild(createCardElement(card));
    });
  } else {
    const currentCardIds = new Set();
    grid.querySelectorAll('.card').forEach(el => {
      currentCardIds.add(el.dataset.cardId);
    });
    const newCardIds = new Set(sorted.map(c => c.id));
    for (const el of grid.querySelectorAll('.card')) {
      if (!newCardIds.has(el.dataset.cardId)) {
        el.remove();
      }
    }
    sorted.forEach((card, index) => {
      const existingEl = grid.querySelector(`[data-card-id="${card.id}"]`);
      const targetPosition = grid.children[index];
      if (!existingEl) {
        const newCard = createCardElement(card);
        if (targetPosition) {
          grid.insertBefore(newCard, targetPosition);
        } else {
          grid.appendChild(newCard);
        }
      } else if (existingEl !== targetPosition) {
        if (targetPosition) {
          grid.insertBefore(existingEl, targetPosition);
        } else {
          grid.appendChild(existingEl);
        }
      }
    });
  }
  isRendering = false;
}

function updateCardSize(value) {
  const size = parseInt(value);
  document.documentElement.style.setProperty('--card-min-size', size + 'px');
  document.getElementById('slider-value').textContent = size;
  localStorage.setItem('cardSize', size);
}

function setHeaderVisibility(visible) {
  const header = document.getElementById('main-header');
  const pullTab = document.getElementById('pull-tab');
  
  if (isPinned) return; // Don't change if pinned
  
  isHeaderVisible = visible;
  
  if (visible) {
    header.classList.remove('hidden');
    // Show pull tab but make it subtle (not hidden)
    pullTab.classList.remove('hidden');
  } else {
    header.classList.add('hidden');
    pullTab.classList.remove('hidden');
  }
}

// Toggle header visibility via pull tab
function toggleHeaderVisibility() {
  if (isPinned) return; // Don't toggle if pinned
  setHeaderVisibility(!isHeaderVisible);
}

// Toggle pin
function togglePin() {
  const header = document.getElementById('main-header');
  const pinToggle = document.getElementById('pin-toggle');
  const pullTab = document.getElementById('pull-tab');
  
  isPinned = !isPinned;
  
  if (isPinned) {
    header.classList.add('pinned');
    header.classList.remove('hidden');
    pinToggle.classList.add('active');
    pinToggle.textContent = '⤓';
    pinToggle.title = 'Unpin header (auto-hide on scroll)';
    // Hide pull tab when pinned
    pullTab.classList.add('hidden');
    isHeaderVisible = true;
  } else {
    header.classList.remove('pinned');
    pinToggle.classList.remove('active');
    pinToggle.textContent = '⤒';
    pinToggle.title = 'Pin header (always visible)';
    // Show pull tab when unpinned
    pullTab.classList.remove('hidden');
    // Keep header in its current state (don't force it open)
    if (!isHeaderVisible) {
      header.classList.add('hidden');
    }
  }
  localStorage.setItem('headerPinned', isPinned);
}

// Scroll handling - only hides, never reveals
function handleScroll() {
  if (isPinned) return;
  if (isUserInteracting) return;
  
  const currentScrollY = window.scrollY;
  const header = document.getElementById('main-header');
  
  // Only hide on scroll down, never reveal on scroll up
  if (currentScrollY > lastScrollY && currentScrollY > 50) {
    // Scrolling down - hide header if it's visible
    if (isHeaderVisible) {
      setHeaderVisibility(false);
    }
  }
  // Scrolling up - do nothing (header stays hidden)
  
  lastScrollY = currentScrollY;
}

let scrollTimeout;
window.addEventListener('scroll', () => {
  if (!scrollTimeout) {
    scrollTimeout = setTimeout(() => {
      handleScroll();
      scrollTimeout = null;
    }, 10);
  }
});

async function loadCards(){
  // Determine default card size based on screen width
  let defaultSize = 165;
  const screenWidth = window.innerWidth;
  if (screenWidth < 600) {
    defaultSize = 95;
  } 
  
  const savedSize = localStorage.getItem('cardSize');
  let sizeToUse = savedSize ? parseInt(savedSize) : defaultSize;
  
  // Apply the size
  document.getElementById('card-size-slider').value = sizeToUse;
  document.documentElement.style.setProperty('--card-min-size', sizeToUse + 'px');
  document.getElementById('slider-value').textContent = sizeToUse;
  
  const savedPin = localStorage.getItem('headerPinned');
  if (savedPin === 'true') {
    isPinned = true;
    const header = document.getElementById('main-header');
    const pinToggle = document.getElementById('pin-toggle');
    const pullTab = document.getElementById('pull-tab');
    header.classList.add('pinned');
    header.classList.remove('hidden');
    pinToggle.classList.add('active');
    pinToggle.textContent = '⤓';
    pinToggle.title = 'Unpin header (auto-hide on scroll)';
    pullTab.classList.add('hidden');
    isHeaderVisible = true;
  } else {
    // Default: header open, pull tab visible
    isHeaderVisible = true;
    document.getElementById('main-header').classList.remove('hidden');
    document.getElementById('pull-tab').classList.remove('hidden');
  }
  
  try{
    const [cardsResponse, enchResponse] = await Promise.all([
      fetch(API),
      fetch(ENCHANTMENTS_API)
    ]);
    if(!cardsResponse.ok){
      throw new Error(`Spire Codex returned HTTP ${cardsResponse.status}`);
    }
    const cardsData = await cardsResponse.json();
    cards = Array.isArray(cardsData) ? cardsData : (cardsData.cards || cardsData.results || []);
    if(enchResponse.ok){
      const enchData = await enchResponse.json();
      enchantments = Array.isArray(enchData) ? enchData : (enchData.enchantments || enchData.results || []);
    }
    render();
  }catch(error){
    document.getElementById("status").textContent = "Failed to load cards.";
    document.getElementById("grid").innerHTML = `
      <div class="error">
        <strong>Could not load the Spire Codex card database.</strong>
        <p>${esc(error.message)}</p>
        <p>
          If your browser blocks requests from a local HTML file,
          run this file through a simple local web server instead.
        </p>
      </div>`;
  }
}

// Event listeners
document.querySelectorAll(".color-toggle").forEach(button => {
  button.addEventListener("click", () => {
    button.classList.toggle("active");
    render();
  });
});

document.getElementById("sort").addEventListener("change", render);
document.getElementById("search").addEventListener("input", render);

document.getElementById("reset").addEventListener("click", () => {
  document.querySelectorAll(".color-toggle").forEach(button => {
    button.classList.add("active");
  });
  document.getElementById("sort").value = "rarity-asc";
  document.getElementById("search").value = "";
  cardStates = {};
  imageCache.clear();
  render();
});

document.getElementById('card-size-slider').addEventListener('input', (e) => {
  updateCardSize(e.target.value);
});

// Pull tab toggle
document.getElementById('pull-tab').addEventListener('click', toggleHeaderVisibility);

// Pin toggle event listeners
const pinToggle = document.getElementById('pin-toggle');
pinToggle.addEventListener('click', togglePin);
pinToggle.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    togglePin();
  }
});

loadCards();
</script>
